apiVersion: streams/v1
status: ready

source: yotpo
stream: review-metadata
display_name: Yotpo Review Metadata

mode: rest
api_version: "v1"
endpoint: review-metadata

schedule: rate(60 minutes)
backfill_enabled: true

schema_version: yotpo.review-metadata.v1
normalizes_to: review_metadata

idempotency_key:
  - review_id
  - updated_at
cursor_field: updated_at
cursor_type: datetime

freshness_sla_minutes: 120
max_pages_per_run: 1
page_size: 500
rate_limit_bucket: yotpo

owner: platform
tags:
  - reviews
  - yotpo
  - metadata
